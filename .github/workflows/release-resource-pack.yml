name: Release resource pack

on:
  push:
    branches:
      - main
    paths:
      - "overrides/kubejs/assets/**/lang/ru_ru.json"
      - "tools/build_resource_pack.py"
      - ".github/workflows/release-resource-pack.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build resource pack
        run: python3 tools/build_resource_pack.py

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="dist/Astropolis-RU-ResourcePack-2.2-ru.1.zip"
          if gh release view resourcepack-latest >/dev/null 2>&1; then
            gh release upload resourcepack-latest "$asset" --clobber
          else
            gh release create resourcepack-latest "$asset" \
              --target "$GITHUB_SHA" \
              --title "Astropolis RU resource pack" \
              --notes "Автоматически загружаемый русификатор для Astropolis 2.2."
          fi
